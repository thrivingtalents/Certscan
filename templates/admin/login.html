<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · {{ app_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><div class="pub"><div class="plain" style="margin-top:14vh">
  <div class="plainlogo"><img src="{{ url_for('static', filename='brand/logo.png') }}" alt="Thriving Talents"></div>
  <form method="post" class="card pad" style="text-align:left">
    <h2 style="margin-bottom:16px">Admin log in</h2>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field {{ 'has-err' if error }}"><label class="lbl" for="pw">Password</label>
      <div class="pwwrap">
        <input id="pw" type="password" name="password" autofocus autocomplete="current-password">
        <button type="button" class="pwtoggle" id="pwToggle" aria-controls="pw" aria-pressed="false" aria-label="Show password">
          <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          <span class="pwtext">Show</span>
        </button>
      </div>
      {% if error %}<div class="err">{{ error }}</div>{% endif %}</div>
    <button class="btn block">Log in</button>
    {% if default_pw %}<p class="hint" style="margin-top:12px">Using the default password <code>change-me</code>. Set <code>ADMIN_PASSWORD</code> in your <code>.env</code> file before going live.</p>{% endif %}
  </form>
</div></div>
<script>
(function () {
  const pw = document.getElementById("pw"), btn = document.getElementById("pwToggle");
  btn.addEventListener("click", () => {
    const show = pw.type === "password";
    pw.type = show ? "text" : "password";
    btn.setAttribute("aria-pressed", show ? "true" : "false");
    btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
    btn.querySelector(".pwtext").textContent = show ? "Hide" : "Show";
    pw.focus();
  });
  // hide it again when logging in, so the browser never offers to save it as plain text
  pw.form.addEventListener("submit", () => { pw.type = "password"; });
})();
</script>
</body></html>
